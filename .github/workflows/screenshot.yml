name: Screenshot leaderboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elite-repository-auto-updates
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take screenshot
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const page = await browser.newPage();

            await page.setViewport({
              width: 2100,
              height: 1000
            });

            await page.goto(
              'https://hdlan-info.github.io/boom-beach-team-U0RLR/',
              { waitUntil: 'networkidle2' }
            );

            await page.waitForSelector('#team');
            await new Promise(r => setTimeout(r, 2000));

            await page.emulateMediaType('screen');

            const pageWidth = await page.evaluate(() =>
              Math.ceil(document.documentElement.scrollWidth)
            );
            await page.setViewport({ width: pageWidth, height: 1000 });

            await page.screenshot({
              path: 'leaderboard.jpg',
              type: 'jpeg',
              quality: 95,
              fullPage: true
            });

            await browser.close();
          })();
          EOF

      - name: Commit screenshot
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add leaderboard.jpg
          git commit -m "Update screenshot" || echo "No changes"
          git pull --rebase origin main
          git push
