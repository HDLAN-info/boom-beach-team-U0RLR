<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diplomy Task Force CZECH ELITE</title>
  <style>
    :root { color-scheme: dark; --gold:#f1bd39; --paper:#e8d5a8; --blue:#173d58; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #2e7287; }
    body { min-height: 100vh; margin: 0; color: #292a2d; font-family: "Trebuchet MS", Arial, sans-serif; background: url("img/noise.png") repeat, #2e7287; }
    
    .page-shell { position:relative; width:min(1800px, calc(100% - 40px)); margin:0 auto; padding:34px 0 70px; }
    .gallery-header { display:flex; align-items:center; gap:24px; margin-bottom:30px; padding:20px 28px; border:2px solid rgba(255,220,125,.45); border-radius:18px; background:url("img/noise.png") repeat, #e0d5b3; box-shadow:0 15px 45px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.18); }
    .gallery-logo { width:104px; height:104px; object-fit:contain; filter:drop-shadow(0 8px 9px rgba(0,0,0,.5)); }
    .gallery-heading { flex:1; min-width:0; }
    h1 { margin:0; color:var(--gold); font-size:clamp(34px,4vw,64px); line-height:1; letter-spacing:.025em; text-shadow:-2px -2px #000,2px -2px #000,-2px 2px #000,2px 2px #000,0 6px rgba(0,0,0,.55); }
    .subtitle { margin:10px 0 0; color:#292a2d; font-size:clamp(16px,1.5vw,24px); }
    .back-link { flex:none; padding:16px 22px; border:0; border-radius:10px; color:#fff; background:linear-gradient(#f2c85c,#d99a2f); font-size:20px; font-weight:900; text-decoration:none; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,2px 3px 1px #000; box-shadow:0 14px 28px rgba(0,0,0,.34); }
    .back-link:hover,.back-link:focus-visible { transform:translateY(-2px); filter:brightness(1.12); outline:none; }
    .empty-gallery { grid-column:1/-1; padding:60px; border-radius:16px; text-align:center; font-size:32px; font-weight:800; background:url("img/noise.png") repeat, #e0d5b3; } .diploma-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; }
    .diploma-card { overflow:hidden; border:2px solid rgba(255,224,146,.5); border-radius:16px; color:#212126; background:url("img/noise.png") repeat, #e0d5b3; box-shadow:0 14px 28px rgba(0,0,0,.34),inset 0 1px #fff3cf; cursor:pointer; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
    .diploma-card:hover,.diploma-card:focus-visible { transform:translateY(-6px) scale(1.015); border-color:#ffe08a; box-shadow:0 20px 40px rgba(0,0,0,.46),0 0 22px rgba(255,194,45,.22); outline:none; }
    .thumb-wrap { height:290px; display:flex; align-items:center; justify-content:center; padding:12px; background:url("img/noise.png") repeat, #e0d5b3; }
    .diploma-card img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 5px 8px rgba(0,0,0,.45)); }
    .card-info { min-height:105px; padding:16px 18px 18px; border-top:2px solid rgba(108,73,19,.42); }
    .card-date { display:block; margin-bottom:6px; color:#73500f; font-size:16px; font-weight:900; letter-spacing:.07em; text-transform:uppercase; }
    .card-title { margin:0; font-size:22px; line-height:1.15; }
    .lightbox { position:fixed; inset:0; z-index:20000; display:none; align-items:center; justify-content:center; padding:28px; background:url("img/noise.png") repeat, #2e7287; }
    .lightbox.visible { display:flex; }
    .lightbox-panel { display:grid; grid-template-rows:minmax(0,1fr) auto; width:min(1500px,100%); height:min(94vh,1120px); overflow:hidden; border:3px solid #e9bc55; border-radius:18px; background:url("img/noise.png") repeat, #e0d5b3; box-shadow:0 30px 90px rgba(74,55,23,.4); }
    .lightbox-image-wrap { min-height:0; display:flex; align-items:center; justify-content:center; padding:18px; background:url("img/noise.png") repeat, #e0d5b3; }
    .lightbox-image { display:block; max-width:100%; max-height:100%; object-fit:contain; border:0; outline:0; box-shadow:0 18px 18px -18px rgba(0,0,0,.55); }
    .lightbox-footer { display:flex; align-items:center; gap:20px; padding:16px 20px; background:linear-gradient(90deg,#e7d4a6,#c9ae73); color:#222; }
    .lightbox-meta { flex:1; min-width:0; }
    .lightbox-date { display:block; color:#74510e; font-weight:900; }
    .lightbox-title { margin:3px 0 0; font-size:25px; }
    .download-link { flex:none; padding:15px 24px; border:0; border-radius:10px; color:#fff; background:linear-gradient(#f2c85c,#d99a2f); font-size:20px; font-weight:900; text-decoration:none; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,2px 3px 1px #000; box-shadow:0 14px 28px rgba(0,0,0,.34); }
    .download-link:hover,.download-link:focus-visible { filter:brightness(1.12); outline:none; }
    @media (max-width:1250px) { .diploma-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:850px) { .gallery-header { align-items:flex-start; flex-wrap:wrap; } .gallery-logo { width:80px; height:80px; } .back-link { margin-left:auto; } .diploma-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .thumb-wrap { height:250px; } }
    @media (max-width:560px) { .page-shell { width:min(100% - 20px,1800px); padding-top:10px; } .gallery-header { gap:12px; padding:16px; } .gallery-logo { width:62px; height:62px; } .gallery-heading { width:calc(100% - 76px); } .back-link { width:100%; text-align:center; } .diploma-grid { grid-template-columns:1fr; gap:16px; } .thumb-wrap { height:330px; } .lightbox { padding:8px; } .lightbox-panel { height:calc(100vh - 16px); } .lightbox-footer { align-items:stretch; flex-direction:column; gap:12px; } .download-link { text-align:center; } }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="gallery-header">
      <img class="gallery-logo" src="img/boombeach-logo.png" alt="Boom Beach">
      <div class="gallery-heading"><h1>SÍŇ SLÁVY</h1><p class="subtitle">Diplomy a významné okamžiky Task Force CZECH ELITE #U0RLR 🇨🇿</p></div>
      <a class="back-link" href="index.html">ZPĚT NA PŘEHLED</a>
    </header>
    <section class="diploma-grid" aria-label="Diplomy od nejstaršího po nejnovější"><p class="empty-gallery">Diplomy budou doplněny později.</p></section>
  </main>
  <div id="diplomaLightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
    <div class="lightbox-panel">
      <div class="lightbox-image-wrap"><img id="lightboxImage" class="lightbox-image" alt=""></div>
      <footer class="lightbox-footer"><div class="lightbox-meta"><span id="lightboxDate" class="lightbox-date"></span><h2 id="lightboxTitle" class="lightbox-title"></h2></div><a id="downloadDiploma" class="download-link" href="#" download>STÁHNOUT DIPLOM</a></footer>
    </div>
  </div>
  <script>
    const lightbox=document.getElementById("diplomaLightbox"), lightboxImage=document.getElementById("lightboxImage"), lightboxDate=document.getElementById("lightboxDate"), lightboxTitle=document.getElementById("lightboxTitle"), downloadDiploma=document.getElementById("downloadDiploma");
    function openDiploma(card){ lightboxImage.src=card.dataset.image; lightboxImage.alt=card.dataset.title; lightboxDate.textContent=card.dataset.date; lightboxTitle.textContent=card.dataset.title; downloadDiploma.href=card.dataset.image; downloadDiploma.download=card.dataset.download; lightbox.classList.add("visible"); document.body.style.overflow="hidden"; }
    function closeDiploma(){ lightbox.classList.remove("visible"); lightboxImage.removeAttribute("src"); document.body.style.overflow=""; }
    document.querySelectorAll(".diploma-card").forEach(card=>{ card.addEventListener("click",()=>openDiploma(card)); card.addEventListener("keydown",event=>{ if(event.key==="Enter"||event.key===" "){ event.preventDefault(); openDiploma(card); } }); });
    lightbox.addEventListener("click",event=>{ if(event.target===lightbox||event.target.classList.contains("lightbox-image-wrap")) closeDiploma(); });
    document.addEventListener("keydown",event=>{ if(event.key==="Escape") closeDiploma(); });
  </script>
</body>
</html>
